[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "brainos-certify"
version = "0.1.0"
description = "Integration certification toolkit for BrainOS source plugins (software checks only; never hardware or human validation)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary (internal preview)" }
# Runs a plugin exactly as BrainOS does (the adapter SDK's plugin host) WITHOUT BrainOS
# installed. jsonschema validates the reports it writes (and, with [runtime], BrainOS events).
dependencies = [
    "brainos-adapter-sdk>=1.0,<2",
    "numpy>=1.26",
    "jsonschema>=4.18",
]

[project.optional-dependencies]
# The runtime phase (capability negotiation + event-contract compliance) runs the plugin
# through BrainOS's own PluginAdapter and Runtime, in process. BrainOS is installed from
# the repository (backend/), see the README.
runtime = ["brainos>=0.3"]
dev = ["pytest>=8", "mypy>=1.10", "ruff>=0.5", "types-jsonschema>=4.18"]

[project.scripts]
brainos-certify = "brainos_certify.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/brainos_certify"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "RUF", "SIM"]

[tool.mypy]
strict = true
files = ["src/brainos_certify", "scripts", "tests"]

[[tool.mypy.overrides]]
# BrainOS (optional [runtime] phase) ships no py.typed marker; analyse it anyway.
module = ["brainos", "brainos.*"]
follow_untyped_imports = true

[[tool.mypy.overrides]]
module = ["pylsl", "pylsl.*"]
ignore_missing_imports = true
