[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "concord-brainflow"
version = "0.1.0"
description = "Concord source plugin for BrainFlow boards (official BoardShim API; noninvasive research devices, read-only)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary (internal preview)" }
dependencies = [
    "concord-adapter-sdk>=1.0,<2",
    "brainflow>=5.12",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.entry-points."concord.sources"]
brainflow = "concord_brainflow.plugin:BrainFlowPlugin"

[tool.hatch.build.targets.wheel]
packages = ["src/concord_brainflow"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = ["brainflow", "brainflow.*"]
ignore_missing_imports = true
