[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neurometric"
version = "0.1.0"
description = "Input-agnostic functional outcome measurement and real-world evidence research infrastructure for neural interfaces and assistive technology (research software; not a medical device)."
requires-python = ">=3.11"
license = { text = "Proprietary - all rights reserved (pending founder IP decision)" }
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "pandas>=2.0",
  "statsmodels>=0.14",
  "matplotlib>=3.8",
  "pydantic>=2.5",
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "reportlab>=4.0",
  "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "pingouin>=0.5", "jsonschema>=4"]

[project.scripts]
neurometric = "neurometric.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
neurometric = ["schemas/*.json", "instruments/defs/*.json", "tasks/defs/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not slow'"
markers = ["slow: long-running statistical coverage studies (run with -m slow)"]
