[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "brainos"
version = "0.3.0"
description = "BrainOS: hardware-agnostic, read-only runtime and SDK for implanted brain-computer interfaces (MVP)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "httpx>=0.27",       # SDK REST client
    "websockets>=13",    # SDK stream client
]

[project.optional-dependencies]
# Offline neural datasets (NWB) + baseline decoder. numpy is used by both.
nwb = [
    "pynwb>=2.8",
    "numpy>=1.26",
]
# Streaming signal processing + online decoding (causal filters, features).
dsp = [
    "numpy>=1.26",
    "scipy>=1.11",
]
# Live acquisition: Lab Streaming Layer (official liblsl, bundled in pylsl wheels)
# and Open Ephys ZMQ Interface (pyzmq).
live = [
    "pylsl>=1.16",
    "pyzmq>=25",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "mypy>=1.11",
    "ruff>=0.6",
]

[project.scripts]
brainos-server = "brainos.server.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/brainos"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "error::pytest.PytestUnraisableExceptionWarning",
    "ignore:Using `httpx` with `starlette.testclient`",
]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["brainos"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pynwb", "pynwb.*", "hdmf", "hdmf.*", "h5py", "pylsl", "pylsl.*", "scipy", "scipy.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "RUF", "SIM"]
ignore = ["RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501", "ASYNC109", "ASYNC110"]
"../scripts/bench.py" = ["E501"]  # emits markdown tables
"src/brainos/decoding/evaluate_falcon.py" = ["E501"]  # emits markdown tables
