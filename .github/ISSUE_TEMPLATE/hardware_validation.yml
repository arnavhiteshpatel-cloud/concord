name: Hardware validation result
description: Share a concord-hwval report from your acquisition system (PASS, FAIL or INCONCLUSIVE).
labels: ["hardware-validation"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for testing Concord against your equipment. Follow the
        [hardware validation protocol](https://github.com/arnavhiteshpatel-cloud/brainos/blob/main/docs/HARDWARE_VALIDATION.md).
        Attach the **report files only** (`*.hwval.json` and `*.hwval.md`), never the recordings:
        they may contain neural data. Use a phantom, signal generator or shorted inputs, never a
        person or an animal.
  - type: input
    id: system
    attributes:
      label: Acquisition system
      description: Amplifier / board, acquisition software and versions.
      placeholder: "Amplifier X with vendor LSL app 2.1 / Open Ephys GUI 1.1.0 + acquisition board"
    validations:
      required: true
  - type: dropdown
    id: path
    attributes:
      label: Data path
      options:
        - Lab Streaming Layer (compared with LabRecorder XDF)
        - Open Ephys ZMQ Interface (compared with the Record Node, Binary format)
    validations:
      required: true
  - type: dropdown
    id: result
    attributes:
      label: Overall result
      options:
        - PASS
        - FAIL
        - INCONCLUSIVE
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Concord and concord-hwval versions
      placeholder: "concordos 0.3.0, concord-hwval 0.1.0"
    validations:
      required: true
  - type: textarea
    id: report
    attributes:
      label: Report files and notes
      description: Attach the .hwval.json and .hwval.md files, and anything notable about the setup.
    validations:
      required: true
