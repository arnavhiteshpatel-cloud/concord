name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e packages/brainos-adapter-sdk -e "backend[dev,nwb,dsp,live]" -e examples/adapters/brainos-example-adapter
      - name: Cache verified datasets
        uses: actions/cache@v4
        with:
          path: data/datasets
          key: datasets-${{ hashFiles('backend/src/brainos/datasets/*.json') }}
      - name: Download real data (DANDI 000954, checksum-verified) and train demo model
        run: |
          python -m brainos.datasets.fetch
          python -m brainos.decoding.evaluate_falcon
      - name: Lint
        working-directory: backend
        run: |
          ruff check src tests examples ../scripts
          ruff format --check src tests examples ../scripts
          ruff check ../packages/brainos-adapter-sdk ../examples/adapters/brainos-example-adapter
          ruff format --check ../packages/brainos-adapter-sdk ../examples/adapters/brainos-example-adapter
      - name: Type check (mypy --strict)
        working-directory: backend
        run: |
          mypy
          mypy --strict examples/reference_app examples/center_out_task.py
          mypy --strict ../packages/brainos-adapter-sdk/src/brainos_adapter_sdk ../examples/adapters/brainos-example-adapter/src/brainos_example_adapter
      - name: Tests (real-data tests must not be skipped)
        working-directory: backend
        run: |
          set -o pipefail
          mkdir -p ../reports
          pytest -q -rs --junitxml=../reports/pytest-junit.xml | tee ../reports/pytest.log
          if grep -q "real FALCON H1 files not found" ../reports/pytest.log; then
            echo "::error::real-data tests were skipped"; exit 1; fi
          if grep -Eq "could not import '(pylsl|zmq|scipy)'" ../reports/pytest.log; then
            echo "::error::live-protocol tests were skipped"; exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-report
          path: reports/pytest-junit.xml

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:report
      - run: npm run build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vitest-report
          path: reports/vitest-junit.xml

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend
        run: python -m pip install -e packages/brainos-adapter-sdk -e "backend[dev,nwb,dsp,live]" -e examples/adapters/brainos-example-adapter
      - name: Cache verified datasets
        uses: actions/cache@v4
        with:
          path: data/datasets
          key: datasets-${{ hashFiles('backend/src/brainos/datasets/*.json') }}
      - name: Download real data and train demo model
        run: |
          python -m brainos.datasets.fetch
          python -m brainos.decoding.evaluate_falcon
      - name: Build frontend
        working-directory: frontend
        run: npm ci && npm run build
      - name: Install Playwright + Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: End-to-end demo (AT-25)
        run: node e2e/demo.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-report
          path: |
            reports/e2e.json
            e2e/screenshots/
