name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e packages/brainos-adapter-sdk -e "backend[server,dev,nwb,dsp,live]" -e examples/adapters/brainos-example-adapter -e packages/brainos-brainflow -e packages/brainos-bci2000 -e "packages/brainos-certify[dev]"
      - name: Cache verified datasets
        uses: actions/cache@v4
        with:
          path: data/datasets
          key: datasets-${{ hashFiles('backend/src/brainos/datasets/*.json') }}
      - name: Download real data (DANDI 000954, checksum-verified) and train demo model
        run: |
          python -m brainos.datasets.fetch
          python -m brainos.decoding.evaluate_falcon
      - name: Cache T15 cursor+click files
        uses: actions/cache@v4
        with:
          path: data/datasets/dryad-prr4xgxzq
          key: dryad-t15-${{ hashFiles('backend/src/brainos/datasets/dryad/*.json') }}
      - name: T15 cursor+click demo subset (Dryad; needs DRYAD_CLIENT_ID / DRYAD_CLIENT_SECRET secrets)
        env:
          DRYAD_CLIENT_ID: ${{ secrets.DRYAD_CLIENT_ID }}
          DRYAD_CLIENT_SECRET: ${{ secrets.DRYAD_CLIENT_SECRET }}
        run: |
          if python -m brainos.datasets.dryad --verify > /dev/null; then
            echo "BRAINOS_REQUIRE_T15=1" >> "$GITHUB_ENV"
          elif [ -n "$DRYAD_CLIENT_ID" ]; then
            python -m brainos.datasets.dryad && echo "BRAINOS_REQUIRE_T15=1" >> "$GITHUB_ENV"
          else
            echo "::warning::T15 real-data tests will be skipped: add the DRYAD_CLIENT_ID and DRYAD_CLIENT_SECRET repository secrets (a Dryad API account) to run them"
          fi
      - name: "M5 workstream B: stream pinned ECoG demo slices (DANDI 000055, digest-verified)"
        run: python -m brainos.datasets.fetch ajile12
      - name: Lint
        working-directory: backend
        run: |
          ruff check src tests examples ../scripts
          ruff format --check src tests examples ../scripts
          ruff check ../packages ../examples/adapters/brainos-example-adapter
          ruff format --check ../packages ../examples/adapters/brainos-example-adapter
      - name: Type check (mypy --strict)
        working-directory: backend
        run: |
          mypy
          mypy --strict examples/reference_app examples/center_out_task.py
          mypy --strict ../packages/brainos-adapter-sdk/src/brainos_adapter_sdk ../examples/adapters/brainos-example-adapter/src/brainos_example_adapter
          (cd ../packages/brainos-brainflow && mypy --strict src/brainos_brainflow)
          (cd ../packages/brainos-bci2000 && mypy --strict src/brainos_bci2000)
          (cd ../packages/brainos-certify && mypy)
      - name: Tests (real-data tests must not be skipped)
        working-directory: backend
        run: |
          set -o pipefail
          mkdir -p ../reports
          pytest -q -rs --junitxml=../reports/pytest-junit.xml | tee ../reports/pytest.log
          if grep -q "real FALCON H1 files not found" ../reports/pytest.log; then
            echo "::error::real-data tests were skipped"; exit 1; fi
          if grep -Eq "could not import '(pylsl|zmq|scipy)'" ../reports/pytest.log; then
            echo "::error::live-protocol tests were skipped"; exit 1; fi
      - name: "M5 workstream B: real ECoG tests must not be skipped"
        run: |
          if grep -q "real AJILE12 ECoG extracts not found" reports/pytest.log; then
            echo "::error::real ECoG tests were skipped"; exit 1; fi
      - name: Package tests (plugins against official BrainFlow / BCI2000 capture; certify toolkit)
        run: |
          for p in packages/brainos-brainflow packages/brainos-bci2000 examples/adapters/brainos-example-adapter packages/brainos-certify; do
            (cd $p && pytest -q -rs) || exit 1
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-report
          path: reports/pytest-junit.xml
      # Workstream F (M5): the committed compatibility registry, its schema and the generated
      # section of docs/COMPATIBILITY.md must equal what this checkout's evidence produces.
      - name: "Workstream F: compatibility registry is current"
        run: python -m brainos.compat.build --check

  distribution:
    # The developer distribution from built wheels in fresh virtualenvs: an adapter developer
    # with only brainos-adapter-sdk, a lab with brainos[server], an app developer with brainos.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Clean-room distribution check
        run: python scripts/dist_check.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:report
      - run: npm run build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vitest-report
          path: reports/vitest-junit.xml

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend
        run: python -m pip install -e packages/brainos-adapter-sdk -e "backend[server,dev,nwb,dsp,live]" -e examples/adapters/brainos-example-adapter -e packages/brainos-brainflow -e packages/brainos-bci2000
      - name: Cache verified datasets
        uses: actions/cache@v4
        with:
          path: data/datasets
          key: datasets-${{ hashFiles('backend/src/brainos/datasets/*.json') }}
      - name: Download real data and train demo model
        run: |
          python -m brainos.datasets.fetch
          python -m brainos.decoding.evaluate_falcon
      - name: Build frontend
        working-directory: frontend
        run: npm ci && npm run build
      - name: Install Playwright + Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: End-to-end demo (AT-25)
        run: node e2e/demo.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-report
          path: |
            reports/e2e.json
            e2e/screenshots/
