name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e packages/brainos-adapter-sdk -e "backend[server,dev,nwb,dsp,live]" -e examples/adapters/brainos-example-adapter -e packages/brainos-brainflow -e packages/brainos-bci2000 -e "packages/brainos-certify[dev]"
      - name: Cache verified datasets
        uses: actions/cache@v4
        with:
          path: data/datasets
          key: datasets-${{ hashFiles('backend/src/brainos/datasets/*.json') }}
      - name: Download real data (DANDI 000954, checksum-verified) and train demo model
        run: |
          python -m brainos.datasets.fetch
          python -m brainos.decoding.evaluate_falcon
      - name: Lint
        working-directory: backend
        run: |
          ruff check src tests examples ../scripts
          ruff format --check src tests examples ../scripts
          ruff check ../packages ../examples/adapters/brainos-example-adapter
          ruff format --check ../packages ../examples/adapters/brainos-example-adapter
      - name: Type check (mypy --strict)
        working-directory: backend
        run: |
          mypy
          mypy --strict examples/reference_app examples/center_out_task.py
          mypy --strict ../packages/brainos-adapter-sdk/src/brainos_adapter_sdk ../examples/adapters/brainos-example-adapter/src/brainos_example_adapter
          (cd ../packages/brainos-brainflow && mypy --strict src/brainos_brainflow)
          (cd ../packages/brainos-bci2000 && mypy --strict src/brainos_bci2000)
          (cd ../packages/brainos-certify && mypy)
      - name: Tests (real-data tests must not be skipped)
        working-directory: backend
        run: |
          set -o pipefail
          mkdir -p ../reports
          pytest -q -rs --junitxml=../reports/pytest-junit.xml | tee ../reports/pytest.log
          if grep -q "real FALCON H1 files not found" ../reports/pytest.log; then
            echo "::error::real-data tests were skipped"; exit 1; fi
          if grep -Eq "could not import '(pylsl|zmq|scipy)'" ../reports/pytest.log; then
            echo "::error::live-protocol tests were skipped"; exit 1; fi
      - name: Package tests (plugins against official BrainFlow / BCI2000 capture; certify toolkit)
        run: |
          for p in packages/brainos-brainflow packages/brainos-bci2000 examples/adapters/brainos-example-adapter packages/brainos-certify; do
            (cd $p && pytest -q -rs) || exit 1
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-report
          path: reports/pytest-junit.xml

  distribution:
    # The developer distribution from built wheels in fresh virtualenvs: an adapter developer
    # with only brainos-adapter-sdk, a lab with brainos[server], an app developer with brainos.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Clean-room distribution check
        run: python scripts/dist_check.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:report
      - run: npm run build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vitest-report
          path: reports/vitest-junit.xml

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend
        run: python -m pip install -e packages/brainos-adapter-sdk -e "backend[server,dev,nwb,dsp,live]" -e examples/adapters/brainos-example-adapter -e packages/brainos-brainflow -e packages/brainos-bci2000
      - name: Cache verified datasets
        uses: actions/cache@v4
        with:
          path: data/datasets
          key: datasets-${{ hashFiles('backend/src/brainos/datasets/*.json') }}
      - name: Download real data and train demo model
        run: |
          python -m brainos.datasets.fetch
          python -m brainos.decoding.evaluate_falcon
      - name: Build frontend
        working-directory: frontend
        run: npm ci && npm run build
      - name: Install Playwright + Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: End-to-end demo (AT-25)
        run: node e2e/demo.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-report
          path: |
            reports/e2e.json
            e2e/screenshots/

  # ------------------------------------------------------------------------ M5-D
  # Release workstream D: clean-room lab acceptance and the desktop bundle.

  lab-acceptance:
    # From built wheels in fresh virtualenvs, documented commands only: brainos doctor/start/
    # status/stop, an external LSL source in a separate process, FALCON H1 via `brainos dataset`
    # (pinned SHA-256), calibration, an SDK-only app authorized by the operator, session export,
    # and `brainos reproduce` in another fresh venv.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Lab acceptance (clean room)
        run: python scripts/lab_acceptance.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lab-acceptance-report
          path: reports/lab-acceptance.json

  package-linux:
    # The desktop bundle's packaging logic (same PyInstaller spec as macOS), built and run like
    # a user would: headless, crash recovery, and the Tk window under Xvfb.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Tk runtime and a virtual display (for the window check)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends libtk8.6 xvfb
      - name: Install the build environment
        run: |
          python -m pip install -e packages/brainos-adapter-sdk -e "backend[lab,dev]" -e packages/brainos-bci2000
          python -m pip install -r packaging/requirements.txt
      - name: Lint packaging (ruff, mypy --strict)
        working-directory: backend
        run: |
          ruff check ../packaging && ruff format --check ../packaging
          mypy --strict ../packaging/app_entry.py ../packaging/stage_console.py ../packaging/build_app.py ../packaging/smoke_test.py
      - name: Build the bundle (PyInstaller onedir)
        run: python packaging/build_app.py --build-console
      - name: Smoke test (headless, crash recovery, Tk window under Xvfb)
        run: |
          mkdir -p reports
          xvfb-run -a python packaging/smoke_test.py packaging/dist/BrainOS/BrainOS --window --report reports/smoke-linux.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: package-linux-report
          path: |
            reports/smoke-linux.json
            packaging/dist/build-info.json

  package-macos:
    # BrainOS.app + .dmg built on macOS and smoke-tested here: the bundled executable headless,
    # crash recovery, the Tk window, `open` (double-click equivalent) + Apple Event quit, and
    # the app from the mounted .dmg. Unsigned (ad-hoc) and not notarized.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install the build environment
        run: |
          python -m pip install -e packages/brainos-adapter-sdk -e "backend[lab]" -e packages/brainos-bci2000
          python -m pip install -r packaging/requirements.txt
      - name: Build BrainOS.app and the .dmg
        run: python packaging/build_app.py --build-console --dmg
      - name: Smoke test the app and the .dmg
        run: |
          mkdir -p reports
          python packaging/smoke_test.py packaging/dist/BrainOS.app/Contents/MacOS/BrainOS \
            --app packaging/dist/BrainOS.app --window --gui \
            --dmg "$(ls packaging/dist/BrainOS-*.dmg)" --report reports/smoke-macos.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: brainos-macos-dmg
          path: |
            packaging/dist/BrainOS-*.dmg
            packaging/dist/build-info.json
            reports/smoke-macos.json
