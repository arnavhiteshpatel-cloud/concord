[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "brainos-example-adapter"
version = "0.1.0"
description = "Example BrainOS source plugin: a declared-synthetic motor-imagery EEG generator"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary (internal preview)" }
# A plugin depends on the public adapter SDK only - never on BrainOS itself.
dependencies = ["brainos-adapter-sdk>=1.0,<2", "numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8"]

# This is what makes BrainOS find the plugin: an entry point in the "brainos.sources" group.
# The name (left) becomes part of BrainOS device ids: plugin:example-mi-eeg:<device key>.
[project.entry-points."brainos.sources"]
example-mi-eeg = "brainos_example_adapter.plugin:MotorImageryEEGPlugin"

[tool.hatch.build.targets.wheel]
packages = ["src/brainos_example_adapter"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "RUF", "SIM"]

[tool.mypy]
strict = true
